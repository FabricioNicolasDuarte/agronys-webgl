<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logos/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agronys: herramientas de campo para ganaderia de precision en Argentina y Paraguay. El dato nace en el potrero." />
    <title>Agronys</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-page="index">
    <a class="skip-link" href="#contenido" data-i18n="skip">Saltar al contenido</a>

    <div class="portal">
      <div class="field" aria-hidden="true"></div>
      <div class="soil" aria-hidden="true"></div>
      <svg id="leads" class="leads" aria-hidden="true"></svg>

      <div id="ui">
        <header class="topbar">
          <div class="svc" role="group" aria-label="Servicios tecnicos">
            <button type="button" class="svc-btn" data-layer="automat" aria-label="Automatizacion de procesos" data-tip="Automatizacion de procesos">
              <img src="/icons/automat.svg" alt="" width="18" height="18" />
            </button>
            <button type="button" class="svc-btn" data-layer="dataeng" aria-label="Ingenieria de datos" data-tip="Ingenieria de datos">
              <img src="/icons/dataeng.svg" alt="" width="18" height="18" />
            </button>
            <button type="button" class="svc-btn" data-layer="offline" aria-label="Arquitectura offline-first" data-tip="Arquitectura offline-first">
              <img src="/icons/offline.svg" alt="" width="18" height="18" />
            </button>
          </div>
          <p class="brand">
            <a href="/">
              <img class="brand-logo" src="/logos/logo-texto-blanco.svg" alt="Agronys" />
            </a>
          </p>
          <div class="top-actions">
            <div class="lang-switch" role="group" data-i18n-aria="lang"></div>
            <a class="profile" href="/entrar/" data-i18n-aria="profile">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5" />
                <path d="M5 19c1.2-3.2 3.8-5 7-5s5.8 1.8 7 5" fill="none" stroke="currentColor" stroke-width="1.5" />
              </svg>
            </a>
          </div>
        </header>

        <main id="contenido" class="board">
          <div class="col col-left">
            <button type="button" class="panel" data-layer="vision" aria-label="Vision artificial">
              <span class="orb" data-node="2" aria-hidden="true">
                <img src="/icons/vision.svg" alt="" width="22" height="22" />
              </span>
            </button>
            <button type="button" class="panel" data-layer="ganaderia" aria-label="Monitoreo 360 con IA">
              <span class="orb" data-node="1" aria-hidden="true">
                <img src="/icons/ganaderia.svg" alt="" width="22" height="22" />
              </span>
            </button>
            <button type="button" class="panel" data-layer="orquestacion" aria-label="Sistema de monitoreo y alertas">
              <span class="orb" data-node="4" aria-hidden="true">
                <img src="/icons/orquestacion.svg" alt="" width="22" height="22" />
              </span>
            </button>
          </div>

          <div class="hub">
            <svg class="hub-art" viewBox="0 0 1020 760" role="img" data-i18n-aria="hub">
              <g class="sway-cow" id="art-vaca"></g>
              <g class="sway-plant" id="art-maiz"></g>
            </svg>
          </div>

          <div class="col col-right">
            <button type="button" class="panel" data-layer="satelital" aria-label="Monitoreo satelital y NDVI">
              <span class="orb" data-node="5" aria-hidden="true">
                <img src="/icons/satelital.svg" alt="" width="22" height="22" />
              </span>
            </button>
            <button type="button" class="panel" data-layer="agro" aria-label="Gestion de potreros">
              <span class="orb" data-node="3" aria-hidden="true">
                <img src="/icons/agro.svg" alt="" width="22" height="22" />
              </span>
            </button>
            <button type="button" class="panel" data-layer="datos" aria-label="Captura de datos en campo">
              <span class="orb" data-node="0" aria-hidden="true">
                <img src="/icons/datos.svg" alt="" width="22" height="22" />
              </span>
            </button>
          </div>
        </main>

        <div class="bottom-bar">
          <nav class="dock" data-i18n-aria="navDock">
            <a class="dock-link" href="/quienes-somos/" data-i18n="navAbout">Quiénes somos</a>
            <a class="dock-link" href="/enfoque/" data-i18n="navApproach">Enfoque</a>
            <a class="dock-link" href="/servicios/" data-i18n="navServices">Servicios</a>
            <a class="dock-link" href="/productos/" data-i18n="navProducts">Productos</a>
            <a class="dock-link" href="/contacto/" data-i18n="navContact">Contacto</a>
          </nav>
          <footer class="legal-mini">
            <button type="button" class="legal-toggle" aria-expanded="false" aria-controls="legal-panel">
              <span data-i18n="legal">Legal</span>
              <span class="legal-copy">© <span id="y"></span></span>
            </button>
            <nav id="legal-panel" class="legal-panel" hidden data-i18n-aria="legal">
              <a href="/aviso-legal/" data-i18n="legalNotice">Aviso legal</a>
              <a href="/privacidad/" data-i18n="privacy">Privacidad</a>
              <a href="/cookies/" data-i18n="cookiesLink">Cookies</a>
              <a href="/terminos/" data-i18n="terms">Términos</a>
              <a href="/accesibilidad/" data-i18n="a11y">Accesibilidad</a>
              <a href="/contacto/" data-i18n="contact">Contacto</a>
            </nav>
          </footer>
        </div>
      </div>
      <div id="cascade" class="cascade" hidden></div>
    </div>

    <div id="cookies-bar" class="cookies" hidden>
      <p data-i18n="cookies" data-i18n-html="1">Usamos solo una preferencia técnica para recordar este aviso. <a href="/cookies/">Más información</a>.</p>
      <button type="button" id="cookies-ok" data-i18n="cookiesOk">Aceptar</button>
    </div>

    <section id="sheet" class="sheet" hidden>
      <div class="sheet-inner" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <header class="sheet-bar">
          <p class="brief-kicker" id="sheet-kicker"></p>
          <button type="button" class="sheet-close" id="sheet-close" data-i18n="close">Cerrar</button>
        </header>
        <h1 id="sheet-title"></h1>
        <p id="sheet-lead"></p>
        <ul id="sheet-list"></ul>
        <p id="sheet-extra" class="sheet-extra"></p>
        <div id="sheet-demo" class="demo sheet-demo"></div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
